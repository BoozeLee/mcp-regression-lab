# Copy this file into a customer's .github/workflows/ directory.
name: MCP contract check
on:
  pull_request:
permissions:
  pull-requests: write
jobs:
  contract-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: BoozeLee/mcp-regression-lab@v1
        with:
          mcp-url: https://your-mcp-server.example.com/mcp
          baseline: .mcp-contract.json
